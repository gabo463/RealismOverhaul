=================================================================================
//  Gas Core Aerospike NTR (ntr-gc-25-3)
//  Hydrogen Mode
//
//  Dry Mass: 38000 Kg
//  Thrust (SL): 1290 kN
//  Thrust (Vac): 1500 kN
//  ISP: 2150 SL / 2500 Vac   [1]
//  Burn Time: 1200/21600     [1]
//  Chamber Pressure: 12.16 MPa
//  Chamber Temp: 20000 K
//  Propellant: LH2 / EnrichedUranium
//  Prop Ratio: N/A
//  Throttle: 40% min throttle
//  Nozzle Ratio: Aerospike Plug (Altitude Compensating)
//  Ignitions: 20
//
//  SOURCES:
//  [1] NASA Lewis Research Center: Gas Core Plug Nozzle / Aerospike Performance Models.
//      Toroidal aerospike plug integration on high-pressure gas core reactor.
// =================================================================================
@PART[*]:HAS[#engineType[GasCoreAerospike]]:FOR[RealismOverhaulEngines]
{
	%title = Gas Core Aerospike NTR
	%manufacturer = Rocketdyne
	%description = An open-cycle gas core engine combined with an aerospike nozzle for flat sea-level to vacuum efficiency. Ideal for high-gravity single-stage-to-orbit or heavy atmospheric departure craft.
	%specLevel = concept
    @tags ^= :$: USA rocketdyne ajr open cycle gas core ntr nuclear pump upper lqdhydrogen aerospike
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		configuration = GasCoreAerospike
		origMass = 38.0

		CONFIG
		{
			name = GasCoreAerospike
			minThrust = 600
			maxThrust = 1500
			heatProduction = 280

			ullage = True
			pressureFed = False
			ignitions = 30
			throttleResponseRate = 0.04

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 5.0
			}

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}

			PROPELLANT
			{
				name = EnrichedUranium
				ratio = 0.0000001
				ignoreForIsp = True
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 1250
				key = 1 2150
			}
            TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedContinuousBurnTime = 1200
				ratedBurnTime = 21600

				explicitDataRate = True
				ignitionReliabilityStart = 0.90
				ignitionReliabilityEnd = 0.998
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.93
				cycleReliabilityEnd = 0.992
				reliabilityMidV = 0.8
				reliabilityMidH = 0.1
				reliabilityMidTangentWeight = 0
			}
		}
	}

	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 4.0
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 9
	}


	RESOURCE
	{
		name = EnrichedUranium
		amount = 30
		maxAmount = 30
	}
	RESOURCE
	{
		name = DepletedUranium
		amount = 0
		maxAmount = 30
	}
}