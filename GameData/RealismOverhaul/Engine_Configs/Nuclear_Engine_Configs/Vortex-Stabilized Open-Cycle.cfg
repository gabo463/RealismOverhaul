// =================================================================================
//  Vortex-Stabilized Open-Cycle NTR
//  Open-Cycle Gas Core, Vortex-Stabilized (Fluid-Mechanics Confinement)
//
//  Dry Mass: 63500 Kg        [1] 140,000 lb reference engine weight
//  Thrust (SL): N/A          [1] Deep-space-only concept; no SL case studied
//  Thrust (Vac): 6450 kN     [1] 1.45x10^6 lbf reference design thrust
//  ISP: N/A SL / 2190 Vac    [1][E] Vac Isp is sourced; SL Isp is an unsourced
//                                 estimate, tuned to a ~78% SL/Vac ratio
//                                 consistent with an aerospike nozzle (see note
//                                 below) rather than a conventional bell
//  Burn Time: 1000 (design ref.)   [1][E] Report cites ~1000 sec typical single-burn
//                                 duration for a reference mission; no separate
//                                 continuous/total burn-life figures given
//  Chamber Pressure: 101.3 MPa   [1] 1000 atm cavity pressure
//  Chamber Temp: N/A          [E] Not explicitly stated for this configuration in [1]
//                                 (light-bulb companion design used ~15,000 R fuel
//                                 temp open-cycle case not separately quantified)
//  Propellant: LH2 / EnrichedUranium
//  Prop Ratio: N/A
//  Throttle: N/A              [E] No throttling data — this was a fixed-point design
//  Nozzle Ratio: N/A          [E] Not specified for this configuration in [1]
//  Ignitions: 10              [E] Gameplay choice — reusable across up to 10
//                                 restarts rather than the single-use point
//                                 design implied by the source study
//
//  NOTE ON AEROSPIKE NOZZLE:
//  This engine also uses an aerospike-type nozzle. Since no NASA source studied
//  an atmospheric case for this design at all, the SL Isp was already a pure
//  estimate (1400s); it's been retuned to a ~78% SL/Vac ratio consistent with a
//  flown reference aerospike (XRS-2200: 339s SL / 436s Vac) rather than the ~64%
//  ratio a vacuum-optimized bell nozzle would show. Gimbal range has also been
//  reduced (2.0 -> 1.0 deg) as a nod to real aerospike/plug designs generally
//  using fixed structures with thrust vectoring via differential segment
//  throttling rather than a mechanical gimbal (see the SCAT/LANTR aerospike
//  note for the same reasoning and citation).
//
//  NOTES:
//  Fuel confinement relies entirely on centrifugal/fluid-mechanics effects from a
//  swirling vortex flow field -- no physical wall separates the fissioning uranium
//  plasma from the hydrogen propellant. The source report's own fluid mechanics
//  testing found this approach could NOT achieve economic fuel retention at
//  full-scale Reynolds numbers, which is why UARL redirected its follow-on work
//  toward the closed-cycle Nuclear Light Bulb design instead. Presented here as a
//  studied-but-abandoned NASA/UARL concept.
//
//  SOURCES:
//  [1] NASA CR-1030 (McLafferty & Bauer, United Aircraft Research Labs, 1968):
//      "Studies of Specific Nuclear Light Bulb and Open-Cycle Vortex-Stabilized
//      Gaseous Nuclear Rocket Engines." Open-cycle reference design: 1000 atm
//      cavity pressure, 2190 s Isp, 1.45x10^6 lbf thrust, 140,000 lb engine
//      weight, fuel/propellant density ratio of 10.0.
//  [E] =  Estimate not traced to a NASA source.
//
// 
// =================================================================================
@PART[*]:HAS[#engineType[VortexOpenCycle]]:FOR[RealismOverhaulEngines]
{
    %title = Vortex-Stabilized Open-Cycle NTR
    %manufacturer = United Aircraft Research Laboratories
    %description = An open-cycle gas core nuclear thermal engine relying entirely on vortex fluid dynamics to confine fissioning uranium plasma against a surrounding hydrogen propellant stream, without any physical containment wall. Theoretically offers extreme thrust and Isp simultaneously, but historical fluid-mechanics testing found fuel retention insufficient for practical use -- an experimental dead end abandoned in favor of the Nuclear Light Bulb concept.
    %specLevel = concept
    @tags ^= :$: USA uarl unitedaircraft vortex opencycle gas core ntr nuclear pump upper lqdhydrogen

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = VortexOpenCycle
        origMass = 63.5

        CONFIG
        {
            name = VortexOpenCycle
            minThrust = 2580
            maxThrust = 6450
            heatProduction = 400

            ullage = True
            pressureFed = False
            ignitions = 10
            throttleResponseRate = 0.03

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 5.0
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 1.0
                DrawGauge = True
            }

            PROPELLANT
            {
                name = EnrichedUranium
                ratio = 0.0000001
                ignoreForIsp = True
                DrawGauge = False
            }

            atmosphereCurve
            {
                key = 0 2190
                key = 1 1708
            }

            TESTFLIGHT:NEEDS[TestLite|TestFlight]
            {
                ratedContinuousBurnTime = 1000
                ratedBurnTime = 3000

                explicitDataRate = True
                ignitionReliabilityStart = 0.85
                ignitionReliabilityEnd = 0.97
                ignitionDynPresFailMultiplier = 0.1
                cycleReliabilityStart = 0.88
                cycleReliabilityEnd = 0.97
                reliabilityMidV = 0.8
                reliabilityMidH = 0.1
                reliabilityMidTangentWeight = 0
                reliabilityDataRateMultiplier = 30
            }
        }
    }

    @MODULE[ModuleGimbal]
    {
        %gimbalRange = 1.0
        %useGimbalResponseSpeed = true
        %gimbalResponseSpeed = 4
    }

    RESOURCE
    {
        name = EnrichedUranium
        amount = 40
        maxAmount = 40
    }
    RESOURCE
    {
        name = DepletedFuel
        amount = 0
        maxAmount = 40
    }
}