// =================================================================================
//  SCAT / LANTR (ntr-sc-375-1)
//  Dual Mode (Pure LH2 / LOX-Augmented LANTR)
//
//  Dry Mass: 10500 Kg         [E] Engineering estimate — no NASA source found
//
//  MODE 1: Pure LH2
//  Thrust (SL): 177 kN
//  Thrust (Vac): 370 kN
//  ISP: 450 SL / 940 Vac      [1] High-temp composite core operating at ~2900 K
//  Burn Time: 3600/36000      [E] Estimate — no NASA source found for burn-life derating
//  Propellant: LH2 / EnrichedUranium
//  Prop Ratio: N/A
//
//  MODE 2: LOX-Augmented (LANTR)
//  Thrust (SL): 1179 kN
//  Thrust (Vac): 1480 kN
//  ISP: 510 SL / 640 Vac      [1] Downstream LOX combustion lowers exhaust molecular weight
//  Burn Time: 1200/14400      [E] Estimate — no NASA source found for thermal/oxidation derating
//  Propellant: LH2 + LOX / EnrichedUranium
//  Prop Ratio: 5.0 O/F Mass Ratio (0.737 LH2 / 0.263 LOX Volumetric)
//
//  Chamber Pressure: 13.79 MPa   [E] Engineering estimate — no NASA source found
//  Chamber Temp: 2900 K (Core) / ~3800 K (Nozzle Afterburn)   [2] Core temp range
//  Throttle: 30% min throttle
//  Nozzle Ratio: 300:1        [2] Matches standard NTR nozzle area ratio
//  Ignitions: 60
//
// SOURCES:
//  https://ntrs.nasa.gov/api/citations/20170003378/downloads/20170003378.pdf
// [1] NASA TM-106726 / AIAA-94-3343 (Borowski & Corban, 1994): "A Revolutionary
//     Lunar Space Transportation System Architecture Using Extraterrestrial
//     LOX-Augmented NTR Propulsion" — origin of the LANTR concept.
//     NASA TM-107095 / AIAA-95-2631 (Borowski, 1995): "Human Lunar Mission
//     Capabilities Using SSTO, ISRU and LOX-Augmented NTR Technologies —
//     A Preliminary Assessment" — MR-vs-thrust/Isp tradeoff data (Isp ~940 to
//     ~515 s as MR varies 0 to 7 T/W increases ~440% from 3 to 13).
// [2] NASA/TM-2016-219402 / AIAA-2015-4524 (Borowski, Sefcik, et al.):
//     "Affordable Development and Demonstration of a Small NTR Engine and
//     Stage: How Small Is Big Enough?" — core exhaust temp (~2550-2950 K)
//     and nozzle area ratio (~300:1) reference data.
// [3] NASA TM-107071 / AIAA-93-4170 (Borowski, Corban, McGuire, Beke, 1993):
//     "Nuclear Thermal Rocket/Vehicle Design Options for Future NASA
//     Missions to the Moon and Mars" — solid-core NTR engine sizing and
//     reactor mass/T-W scaling reference (50 klbf, 900 s Isp, T/W ~4.3).
// [E] =  Estimate not traced to a NASA source.
// =================================================================================


@PART[*]:HAS[#engineType[SCAT]]:FOR[RealismOverhaulEngines]
{
    %title = SCAT / LANTR (LOX-Augmented NTR)
    %manufacturer = NASA / Aerojet
    %description = A 3.75m solid-core nuclear thermal engine capable of injecting Liquid Oxygen directly into the high-temperature hydrogen exhaust. Operates in pure LH2 mode for long interplanetary transfers, or in LANTR mode to boost thrust by 4x for departure/capture maneuvers.
    %specLevel = concept
    @tags ^= :$: USA nasa aerojet ajr scat lantr lox-augmented ntr nuclear pump upper lqdhydrogen lqdoxygen

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        engineID = MainExhaust
        isMaster = true
        configuration = SCAT-LH2
        origMass = 10.5

        CONFIG
        {
            name = SCAT-LH2
            minThrust = 110
            maxThrust = 370
            heatProduction = 90

            ullage = True
            pressureFed = False
            ignitions = 60
            throttleResponseRate = 0.4

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 5.0
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 1.0
                DrawGauge = True
            }

            PROPELLANT
            {
                name = EnrichedUranium
                ratio = 0.00000001
                ignoreForIsp = True
                DrawGauge = False
            }

            atmosphereCurve
            {
                key = 0 940
                key = 1 450
            }

            TESTFLIGHT:NEEDS[TestLite|TestFlight]
            {
                ratedContinuousBurnTime = 3600
                ratedBurnTime = 36000

                explicitDataRate = True
                ignitionReliabilityStart = 0.98
                ignitionReliabilityEnd = 0.9995
                ignitionDynPresFailMultiplier = 0.1
                cycleReliabilityStart = 0.985
                cycleReliabilityEnd = 0.9999
                reliabilityMidV = 0.8
                reliabilityMidH = 0.1
                reliabilityMidTangentWeight = 0
            }
        }

        CONFIG
        {
            name = SCAT-LANTR
            minThrust = 440
            maxThrust = 1480
            heatProduction = 160

            ullage = True
            pressureFed = False
            ignitions = 60
            throttleResponseRate = 0.15

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 5.0
            }

            // Volumetric ratio for O/F = 5.0 mass ratio (83.3% LOX / 16.7% LH2 by weight)
            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 0.737
                DrawGauge = True
            }
            PROPELLANT
            {
                name = LqdOxygen
                ratio = 0.263
                DrawGauge = True
            }
            PROPELLANT
            {
                name = EnrichedUranium
                ratio = 0.00000001
                ignoreForIsp = True
                DrawGauge = False
            }

            atmosphereCurve
            {
                key = 0 640
                key = 1 510
            }

            TESTFLIGHT:NEEDS[TestLite|TestFlight]
            {
                ratedContinuousBurnTime = 1200
                ratedBurnTime = 14400

                explicitDataRate = True
                ignitionReliabilityStart = 0.95
                ignitionReliabilityEnd = 0.995
                ignitionDynPresFailMultiplier = 0.1
                cycleReliabilityStart = 0.96
                cycleReliabilityEnd = 0.999
                reliabilityMidV = 0.8
                reliabilityMidH = 0.1
                reliabilityMidTangentWeight = 0
            }
        }
    }

    @MODULE[ModuleGimbal]
    {
        %gimbalRange = 3.0
        %useGimbalResponseSpeed = true
        %gimbalResponseSpeed = 6
    }

    RESOURCE
    {
        name = EnrichedUranium
        amount = 40
        maxAmount = 40
    }
    RESOURCE
    {
        name = DepletedFuel
        amount = 0
        maxAmount = 40
    }
}