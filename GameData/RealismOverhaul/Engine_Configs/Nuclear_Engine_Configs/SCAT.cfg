=================================================================================
//  SCAT / LANTR (ntr-sc-375-1)
//  Dual Mode (Pure LH2 / LOX-Augmented LANTR)
//
//  Dry Mass: 10500 Kg
//  Thrust (SL): 177 kN LH2 / 1179 kN LANTR
//  Thrust (Vac): 370 kN LH2 / 1480 kN LANTR
//  ISP (LH2): 450 SL / 940 Vac    [1]
//  ISP (LANTR): 510 SL / 640 Vac  [1][2]
//  Burn Time (LH2): 3600/36000    [1]
//  Burn Time (LANTR): 1200/14400  [2]
//  Chamber Pressure: 13.79 MPa
//  Chamber Temp: 2900 K
//  Propellant: LH2 (Mode 1) / LH2 + LOX (Mode 2)
//  Prop Ratio: 5.0 O/F mass ratio (LANTR mode)
//  Throttle: 30% min throttle
//  Nozzle Ratio: 300:1
//  Ignitions: 60
//
//  SOURCES:
//  [1] NASA TM-107078 (Borowski et al., 1995): "LOX-Augmented Nuclear Thermal Rocket 
//      (LANTR) Engine Performance and Mission Capabilities".
//  [2] NASA/TM-206531: LANTR downstream oxygen injection thermal limit and nozzle oxidation study.
// =================================================================================
@PART[*]:HAS[#engineType[SCAT]]:FOR[RealismOverhaulEngines]
{
	%title = SCAT / LANTR (LOX-Augmented NTR)
	%manufacturer = NASA / Aerojet
	%description = A massive 3.75m solid-core nuclear thermal engine capable of injecting Liquid Oxygen directly into the high-temperature hydrogen exhaust. This trades Isp for a massive spike in thrust during launch or heavy burn maneuvers.
    %specLevel = concept
    @tags ^= :$: USA nasa aerojet ajr scat lantr lox-augmented ntr nuclear pump upper lqdhydrogen lqdoxygen
	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEngines
		engineID = MainExhaust
		isMaster = true
		configuration = SCAT-LH2
		origMass = 10.5

		CONFIG
		{
			name = SCAT-LH2
			minThrust = 110
			maxThrust = 370
			heatProduction = 90

			ullage = True
			pressureFed = False
			ignitions = 60
			throttleResponseRate = 0.4

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 5.0
			}

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 1.0
				DrawGauge = True
			}

			PROPELLANT
			{
				name = EnrichedUranium
				ratio = 0.00000001
				ignoreForIsp = True
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 940 
				key = 1 450
			}

			TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedContinuousBurnTime = 3600
				ratedBurnTime = 36000

				explicitDataRate = True
				ignitionReliabilityStart = 0.98
				ignitionReliabilityEnd = 0.9995
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.985
				cycleReliabilityEnd = 0.9999
				reliabilityMidV = 0.8
				reliabilityMidH = 0.1
				reliabilityMidTangentWeight = 0
			}
		}

		CONFIG
		{
			name = SCAT-LANTR
			minThrust = 440
			maxThrust = 1480
			heatProduction = 160

			ullage = True
			pressureFed = False
			ignitions = 60
			throttleResponseRate = 0.15

			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 1.0
			}

			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 0.737
				DrawGauge = True
			}
			PROPELLANT
			{
				name = LqdOxygen
				ratio = 0.263
				DrawGauge = True
			}
			PROPELLANT
			{
				name = EnrichedUranium
				ratio = 0.00000001
				ignoreForIsp = True
				DrawGauge = False
			}

			atmosphereCurve
			{
				key = 0 640
				key = 1 510
			}
            TESTFLIGHT:NEEDS[TestLite|TestFlight]
			{
				ratedContinuousBurnTime = 1200 // Higher thermal/chemical erosion limits continuous operation
				ratedBurnTime = 14400

				explicitDataRate = True
				ignitionReliabilityStart = 0.95
				ignitionReliabilityEnd = 0.995
				ignitionDynPresFailMultiplier = 0.1
				cycleReliabilityStart = 0.96
				cycleReliabilityEnd = 0.999
				reliabilityMidV = 0.8
				reliabilityMidH = 0.1
				reliabilityMidTangentWeight = 0
			}
		}
	}

	@MODULE[ModuleGimbal]
	{
		%gimbalRange = 3.0
		%useGimbalResponseSpeed = true
		%gimbalResponseSpeed = 6
	}


	RESOURCE
	{
		name = EnrichedUranium
		amount = 50
		maxAmount = 50
	}
	RESOURCE
	{
		name = DepletedUranium
		amount = 0
		maxAmount = 50
	}
}