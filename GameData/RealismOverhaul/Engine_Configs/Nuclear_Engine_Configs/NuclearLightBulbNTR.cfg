// =================================================================================
//  Nuclear Light Bulb NTR 
//  Closed-Cycle Gas Core, Vortex-Stabilized
//
//  Dry Mass: 32300 Kg        [1] Derived: 412 kN thrust / (1.3 T/W x 9.80665 m/s^2)
//  Thrust (SL): 187 kN       [E] Estimated — scaled from Vac thrust by Isp ratio;
//                                 NLB reference engine was never modeled for SL ops
//  Thrust (Vac): 412 kN      [1] UARL/NASA reference engine value
//  ISP: 850 SL / 1870 Vac    [1][E] Vac Isp is the sourced reference value;
//                                 SL Isp is an unverified extrapolation
//  Burn Time: 1800/28800     [E] Estimate — no NASA source found for burn-life limits
//  Chamber Pressure: 6.89 MPa   [E] Estimate — no NASA source found (placeholder ~1000 psia)
//  Chamber Temp: N/A (radiative transfer through transparent wall see notes)   [1]
//  Propellant: LH2 / EnrichedUranium
//  Prop Ratio: N/A
//  Throttle: 40% min throttle   [E] Estimate — no NASA source found
//  Nozzle Ratio: 100:1 (conventional bell, altitude-compensating designs not studied)   [E]
//  Ignitions: 20              [E] Estimate — no NASA source found
//
//  NOTES:
//  Unlike open-cycle gas core, the fissioning uranium plasma is contained within a
//  transparent fused-silica ("light bulb") wall. Heat transfers to the seeded
//  hydrogen propellant purely by thermal radiation across this wall, so the fuel
//  never mixes with the exhaust stream. Fuel retention >99.999%, giving a
//  radiologically clean exhaust compared to open-cycle designs — the defining
//  advantage of this engine class.
//
//  SOURCES:
//  [1] NASA CR-1030 (McLafferty & Bauer, United Aircraft Research Labs, 1968):
//      "Studies of Specific Nuclear Light Bulb and Open-Cycle Vortex-Stabilized
//      Gaseous Nuclear Rocket Engines." Follow-on neutronics/critical-mass work:
//      Latham, "Nuclear Studies of the Nuclear Light Bulb Rocket Engine" (NASA/
//      UARL, 1968-69). Reference-engine performance (Isp 1870s, thrust 412 kN,
//      T/W 1.3) per 1992 program overview (Gunn, "In-Reactor Tests of the
//      Nuclear Light Bulb Rocket Concept").
// [E] =  Estimate not traced to a NASA source.
// =================================================================================
@PART[*]:HAS[#engineType[NuclearLightBulb]]:FOR[RealismOverhaulEngines]
{
    %title = Nuclear Light Bulb NTR
    %manufacturer = United Aircraft Research Laboratories
    %description = A closed-cycle gas core nuclear thermal engine. Fissioning uranium plasma is contained within a transparent fused-silica wall and heats seeded hydrogen propellant purely by thermal radiation, keeping fuel out of the exhaust stream. Offers much higher Isp than solid-core NTRs with a far cleaner exhaust than open-cycle gas core designs.
    %specLevel = concept
    @tags ^= :$: USA uarl unitedaircraft nuclearlightbulb closed cycle gas core ntr nuclear pump upper lqdhydrogen

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = NuclearLightBulb
        origMass = 32.3

        CONFIG
        {
            name = NuclearLightBulb
            minThrust = 165
            maxThrust = 412
            heatProduction = 130

            ullage = True
            pressureFed = False
            ignitions = 20
            throttleResponseRate = 0.06

            IGNITOR_RESOURCE
            {
                name = ElectricCharge
                amount = 5.0
            }

            PROPELLANT
            {
                name = LqdHydrogen
                ratio = 1.0
                DrawGauge = True
            }

            PROPELLANT
            {
                name = EnrichedUranium
                ratio = 0.0000001
                ignoreForIsp = True
                DrawGauge = False
            }

            atmosphereCurve
            {
                key = 0 1870
                key = 1 850
            }

            TESTFLIGHT:NEEDS[TestLite|TestFlight]
            {
                ratedContinuousBurnTime = 1800
                ratedBurnTime = 28800

                explicitDataRate = True
                ignitionReliabilityStart = 0.92
                ignitionReliabilityEnd = 0.997
                ignitionDynPresFailMultiplier = 0.1
                cycleReliabilityStart = 0.94
                cycleReliabilityEnd = 0.995
                reliabilityMidV = 0.8
                reliabilityMidH = 0.1
                reliabilityMidTangentWeight = 0
            }
        }
    }

    @MODULE[ModuleGimbal]
    {
        %gimbalRange = 3.0
        %useGimbalResponseSpeed = true
        %gimbalResponseSpeed = 6
    }

    RESOURCE
    {
        name = EnrichedUranium
        amount = 30
        maxAmount = 30
    }
    RESOURCE
    {
        name = DepletedFuel
        amount = 0
        maxAmount = 30
    }
}