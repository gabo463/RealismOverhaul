@PART[IQBM_Leg]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    %rescaleFactor = 1.6
    @mass = 0.085 // 85 kg per leg
    @maxTemp = 900
    @skinMaxTemp = 1200
    %manufacturer = Blue Origin
    %description = Heavy-duty, articulating landing gear specifically engineered for the Blue Moon architecture. Designed to absorb high impact energy on uneven lunar regolith while keeping the engine bell well clear of surface obstructions.
    @crashTolerance = 19
    %breakingForce = 270
    %breakingTorque = 270
}
@PART[IQBM_IU]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    %rescaleFactor = 1.6

    @mass = 0.08

    @maxTemp = 700
    @skinMaxTemp = 1200
    %manufacturer = Blue Origin
    %description = Flight computer, GNC bay, and active thermal management unit for the Blue Moon lander. Features integrated RCS thrusters and an active radiator thermal loop designed to prevent LH2/LOX boil-off during multi-week surface stays.

    !MODULE[ModuleCommand],* {}
    !MODULE[ModuleSAS],* {}
    !MODULE[ModuleRCS*],* {}
    !MODULE[ModuleActiveRadiator],* {}
    !RESOURCE[ElectricCharge],* {}

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 
        }
    }

    MODULE
    {
        name = ModuleActiveRadiator
        maxEnergyTransfer = 25000 // Heat transfer rate in Watts
        overcoolFactor = 0.25
        isStartActive = true
        headroom = 100
        
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.25 // Power draw for thermal fluid pumps & radiator loop
        }
    }

    MODULE
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = rcsTransform
        thrusterPower = 0.111
        resourceFlowMode = STAGE_PRIORITY_FLOW

        PROPELLANT
        {
            name = MMH
            ratio = 0.48
            DrawGauge = True
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.52
        }
        PROPELLANT
        {
            name = Helium
            ratio = 15.0
            ignoreForIsp = True
        }

        atmosphereCurve
        {
            key = 0 290
            key = 1 100
        }
    }
}

@PART[IQBM_Hab]:FOR[RealismOverhaul]
{
    %RSSROConfig = True

    %rescaleFactor = 1.6
    @mass = 3.2 
    %CrewCapacity = 4
    @maxTemp = 750
    @skinMaxTemp = 1400
    %manufacturer = Blue Origin
    %description = Long-duration pressurized habitat and command module for the Blue Moon lander. Includes expanded life support, thermal control systems, and communication equipment capable of sustaining a crew of four for up to 30 days on the lunar surface.


    !MODULE[ModuleDataTransmitter],* {}
    !MODULE[ModuleReactionWheel],* {}
    !MODULE[ModuleFuelTanks],* {}
    !RESOURCE[*],* {}

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 1
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.2 // Base avionics power drain
        }
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 300000 
        
        TANK
        {
            name = ElectricCharge
            amount = 150000
            maxAmount = 150000
        }

        TANK
        {
            name = Food
            amount = 900
            maxAmount = 900
        }
        TANK
        {
            name = Water
            amount = 500
            maxAmount = 500
        }
        TANK
        {
            name = Oxygen
            amount = 160000 // Gaseous oxygen storage
            maxAmount = 160000
        }
        TANK
        {
            name = Nitrogen
            amount = 130000 // Gaseous structural makeup gas
            maxAmount = 130000
        }
        TANK
        {
            name = LithiumHydroxide
            amount = 120
            maxAmount = 120
        }
        TANK
        {
            name = CarbonDioxide
            amount = 0
            maxAmount = 25000
        }
        TANK
        {
            name = Waste
            amount = 0
            maxAmount = 150
        }
        TANK
        {
            name = WasteWater
            amount = 0
            maxAmount = 400
        }

        // --- RCS HYPERGOLS & PRESSURANT ---
        TANK
        {
            name = MMH
            amount = 120
            maxAmount = 120
        }
        TANK
        {
            name = MON3
            amount = 130
            maxAmount = 130
        }
        TANK
        {
            name = Helium
            amount = 4000
            maxAmount = 4000
        }
    }
    {
        name = ModuleRCSFX
        stagingEnabled = True
        thrusterTransformName = rcsTransform 
        !resourceName = DELETE
        thrusterPower = 0.111 // ~111 N thrust per RCS thruster nozzle
        resourceFlowMode = STAGE_PRIORITY_FLOW

        PROPELLANT
        {
            name = MMH
            ratio = 0.48
            DrawGauge = True
        }
        PROPELLANT
        {
            name = MON3
            ratio = 0.52
        }
        PROPELLANT
        {
            name = Helium
            ratio = 15.0
            ignoreForIsp = True
        }

        atmosphereCurve
        {
            key = 0 290 // Vacuum ISP for modern hypergolic attitude control thrusters
            key = 1 100
        }
    }
}