@PART[ExtraDockingPorts-MediumDockingPort]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True

	%rescaleFactor = 3.733

	@title = 7.0m Heavy Duty Docking Mechanism
	@manufacturer =  Nasa/JPL
	@description = A massive, 7.0-meter reinforced docking mechanism designed for large orbital stations, heavy transport craft, and mega-structures.
	%mass = 1.85
	%crashTolerance = 12
	%maxTemp = 1073.15
	%skinMaxTemp = 1773.15
	%bulkheadProfiles = size7, srf
	%physicsMode = 0
	!MODULE[ModuleCargoPart] {}

	@MODULE[ModuleDockingNode]
	{
		@nodeType = 7mDockingPort
		%acquireForce = 15.0
		%acquireTorque = 5.0
		%captureMinThreshold = 0.2
	}
}