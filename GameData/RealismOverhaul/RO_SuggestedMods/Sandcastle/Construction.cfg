// =================================================================================
//  Automated Additive Manufacturing Facility (2.5m AMF)
//  High-Precision Additive Manufacturing Unit
//
//  Dry Mass: 2,500 kg
//  Diameter: 2.5 m
//  EC Storage: 75,000 EC   [REBALANCED: was 50,000 - largest internal battery buffer
//                            of the three units, sized for standalone/untethered
//                            operation away from a base power grid]
//
//  Primary Tech Analogue:
//    - NASA In-Space Manufacturing (ISM) Project & MSEE (Moon to Mars Planetary Autonomous Construction)
//
//  Literature & Sources:
//    - https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
//    - https://www.nasa.gov/wp-content/uploads/2015/03/nwerkheiser_lsii_oct2019_508.pdf
//    - https://ntrs.nasa.gov/api/citations/20220005590/downloads/UK_ADDITIVE%20WORLD_4.20.2022%20%20FINAL.pdf
//
//  Printer Properties (WBIPrintShop / WBIShipwright):
//    - Power Draw: 22 kW (22 EC/s continuous during active print jobs)   [REBALANCED: was 35 kW]
//      [Ref: efficiency-optimized single-head fiber laser array, sized for
//       long-duration unattended operation rather than peak throughput]
//    - Runtime on internal battery: ~57 minutes continuous printing
//    - Primary Input Materials: Regolith Feedstock, Metal, Aluminium, Polymers, Silicon, RareMetals
//
//  Recycler Properties (WBIShipbreaker):
//    - Power Draw: 9 kW (9 EC/s during reclamation)   [REBALANCED: was 15 kW]
//      [Ref: lower-throughput induction furnace tuned for low standby/idle losses]
//    - Recovery Yield: 85% mass recovery to storage buffers
//    - Runtime on internal battery: ~2.3 hours continuous reclamation
//
//  Internal Operational Buffer:
//    - Regolith: 500 units (~800 kg raw feedstock @ ~1.6 t/m^3 bulk density)
//    - Metal: 25 units (~195 kg structural alloy)
//    - Aluminium: 30 units (~83 kg structural alloy @ 2.7 g/cm^3)
//    - Polymers: 50 units (~50 kg resin/composite feedstock)
//    - Silicon: 40 units (~93 kg substrate stock)
//    - RareMetals: 10 units (~78 kg microelectronics/specialty alloys)
//
//  REBALANCE RATIONALE:
//    This is the unit intended to run autonomously, far from a base grid.
//    Draw was reduced and battery buffer increased so it has by far the best
//    EC-storage-to-draw ratio of the three parts (longest independent runtime),
//    at the cost of lower peak power/throughput than the two platforms below.
// =================================================================================

@PART[wbiELSandcaster]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Automated Additive Manufacturing Facility (2.5m AMF)
    @manufacturer = NASA / JPL
    @description = An automated, closed-loop 2.5-meter additive manufacturing unit designed for off-world infrastructure construction. Utilizing high-power laser powder-bed fusion, it sinters raw regolith feedstocks, refined metallic alloys, polymers, and silicon substrates directly into precision components and vessel assemblies without requiring direct human intervention. Its oversized internal battery bank lets it operate for extended periods without external power support.
    %mass = 2.5
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 10
    %breakingForce = 250
    %breakingTorque = 250
    !MODULE[ELConverter],* {}
    !MODULE[ELWorkshop],* {}
    !MODULE[ELSurveyStation],* {}

    !RESOURCE[RocketParts] {}
    !RESOURCE[Metal] {}

    RESOURCE
    {
        name = ElectricCharge
        amount = 75000
        maxAmount = 75000
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 500 
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 25 
    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 30 
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 50 
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 40 
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 10 
    }
    
    MODULE
    {
        name = ModuleCommand
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 
        }
    }

    MODULE:NEEDS[RealAntennas]
    {
        name = ModuleRealAntenna
        antennaDiameter = 1.0 
        RFBand = S
    }
    
    @MODULE[WBIModuleAnimateGenericExtended]
    {
        @animationName = Deploy 
    }

    @MODULE[WBIPrintShop]
    {
        @maxPrintVolume = -1 
        @printSpeedUSec = 0.000002
        @UseSpecialistBonus = false
        %enablePartSpawn = true

        @RESOURCE[ElectricCharge]
        {
            @rate = 22.0 
        }

        CATEGORY_WHITELIST
        {  
            whitelistedCategory = Pods
            whitelistedCategory = Structural
            whitelistedCategory = Payload
            whitelistedCategory = Thermal
            whitelistedCategory = Fuel Tanks
            whitelistedCategory = Robotics
            whitelistedCategory = Ground
            whitelistedCategory = Electrical
            whitelistedCategory = Control
            whitelistedCategory = Communication
            whitelistedCategory = Aero
        }
    }

    MODULE
    {
        name = WBIResourceDistributor
        distributionRange = 50
        distributionMode = Both
    }
    @MODULE[WBIShipwright]
    {
        @spawnTransformName = LaunchPos
        %maxCraftDimensions = 15,15,30 
        @printSpeedUSec = 0.000002

        @RESOURCE[ElectricCharge]
        {
            @rate = 22.0 
        }
    }
    @MODULE[WBIShipbreaker]
    {
        @recyclePercentage = 0.45
        @recycleSpeedUSec = 0.5   
        @maxBuildingDistance = 50
        
        @RESOURCE[ElectricCharge]
        {
            @rate = 9.0 
        }
    }
}


// =================================================================================
//  Off-World Modular Assembly Platform (MAP-75)
//
//  Dry Mass: 5,400 kg
//  Grid Footprint: 7.5 m x 7.5 m base (expandable via grid variants)
//  EC Storage: 9,000 EC   [REBALANCED: was 20,000 - minimal onboard buffer; this
//                          platform is designed to be fed continuously by a base
//                          reactor/solar farm via WBIResourceDistributor, not to
//                          run independently]
//  Logistics: WBIResourceDistributor (500m wireless resource pull radius)
//  Comms: Integrated S-Band Phased Array (Lunar Distance Link / ~1.0m Equivalent)
//
//
//  Literature & Sources:
//    - https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
//    - https://www.nasa.gov/wp-content/uploads/2015/03/nwerkheiser_lsii_oct2019_508.pdf
//    - https://ntrs.nasa.gov/api/citations/20220005590/downloads/UK_ADDITIVE%20WORLD_4.20.2022%20%20FINAL.pdf
//
//  Construction Capabilities:
//    - Part & Vessel Printing Draw: 150 kW (150 EC/s continuous)   [REBALANCED: was 90 kW]
//      [Ref: multi-head industrial laser sintering array + vacuum electron beam
//       deposition, run at full industrial throughput — highest draw of the
//       three units]
//    - Runtime on internal battery: ~60 seconds continuous printing (lowest of the three)
//    - Recycling Power Draw: 65 kW (65 EC/s continuous)   [REBALANCED: was 40 kW]
//    - Max Print Dimensions: 45 m x 45 m x 90 m envelope
//
//  Internal Storage Buffers:
//    - Regolith: 2,000 units (~3,200 kg raw feedstock)
//    - Metal: 200 units (~1,560 kg structural alloy)
//    - Aluminium: 150 units (~415 kg structural aluminium)
//    - Polymers: 50 units (~50 kg synthetic stock)
//    - Lead: 100 units (~1,134 kg radiation shielding / ballast @ 11.34 g/cm^3)
//    - Silicon: 30 units (~70 kg electronics substrate)
//    - RareMetals: 40 units (~312 kg trace elements)
//
//  REBALANCE RATIONALE:
//    Treated as grid-tethered industrial infrastructure: highest instantaneous
//    power draw of the three parts, but the smallest battery-to-draw ratio,
//    so it drains its internal buffer in well under a minute if disconnected
//    from an external power feed.
// =================================================================================

@PART[yardFrameFlat75]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Off-World Modular Assembly Platform (MAP-75)
    @manufacturer = Boeing / Lockheed Martin
    @description = A scaled-up 7.5-meter modular structural truss designed as a heavy foundation for large off-world orbital launches and planetary landing zones. Fitted with high-power multi-beam laser sintering arrays, automated plasma cutters, and long-range wireless logistics feeds for full-scale surface vessel and outpost fabrication utilizing metal, aluminium, lead shielding, polymers, and silicon. Its industrial-grade printing array demands continuous external power; onboard battery reserves are minimal.
    %rescaleFactor = 1.0
    @category = Utility
    %mass = 5.4
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 20
    %breakingForce = 2500
    %breakingTorque = 2500

    @MODULE[WBIModulePartGridVariants]
    {
        @elementLength = 7.5
        @elementWidth = 7.5
        @elementHeight = 0.3
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 9000
        maxAmount = 9000
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 2000 
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 200
    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 150 
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 50 
    }
    RESOURCE
    {
        name = Lead
        amount = 0
        maxAmount = 100 
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 30 
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 40 
    }

    MODULE
    {
        name = ModuleCommand
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 
        }
    }

    MODULE:NEEDS[RealAntennas]
    {
        name = ModuleRealAntenna
        antennaDiameter = 1.0 
        RFBand = S
    }

    MODULE
    {
        name = WBIPrinterRequirements
    }

    MODULE
    {
        name = WBIModuleBoundingBox
    }

    MODULE
    {
        name = WBIResourceDistributor
        distributionRange = 100
        distributionMode = Both
    }

    MODULE
    {
        name = WBIPrintShop
        maxPrintVolume = -1
        printSpeedUSec = 0.00001
        UseSpecialistBonus = true

        enablePartSpawn = true
        spawnTransformName = node_stack_top

        printShopGUIName =  Contsturction Pad
        printShopwGroupDisplayName = Contsturction Pad
        printShopDialogTitle = Contsturction Pad

        RESOURCE
        {
            name = ElectricCharge
            rate = 150.0 
        }
    }

    MODULE
    {
        name = WBIShipwright
        printSpeedUSec = 0.00001
        UseSpecialistBonus = True
        spawnTransformName = node_stack_top
        maxCraftDimensions = 45,45,90
        repositionCraftBeforeSpawning = True

        RESOURCE
        {
            name = ElectricCharge
            rate = 150.0 
        }
    }

    MODULE
    {
        name = WBIShipbreaker
        recycleSpeedUSec = 0.75
        recyclePercentage = 0.85
        UseSpecialistBonus = True
        maxBuildingDistance = 50

        RESOURCE
        {
            name = ElectricCharge
            rate = 65.0 
        }
    }
}


// =================================================================================
//  Orbital Assembly System Manipulator Arm (OAS-Arm)
//  High-Precision Orbital Assembly & Station Reclamation Arm
//
//  Dry Mass: 1,200 kg
//  EC Storage: 800 EC   [REBALANCED: was 2,500 - smallest buffer of the three;
//                        real orbital manipulator arms (Canadarm/SSRMS/ERA) draw
//                        from station bus power, they don't carry their own
//                        multi-hour battery reserve]
//  Logistics: WBIResourceDistributor (500m wireless resource pull/push)
//
//  Primary Tech Analogue:
//    - Canadarm3 (CSA / MDA) - Gateway Station Robotic Servicing System
//    - Shuttle RMS / Canadarm2 (Space Station Remote Manipulator System - SSRMS)
//    - ERA (European Robotic Arm)
//
//  Literature & Sources:
//    - CSA / MDA Canadarm3 Technical Briefing:https://www.asc-csa.gc.ca/eng/canadarm3/data-sheet.asp
//    - https://www.google.com/url?sa=t&rct=j&q=&esrc=s&source=web&cd=&cad=rja&uact=8&ved=2ahUKEwiWytbasaCWAxW9z_ACHZzIHM4QFnoECBoQAQ&url=https%3A%2F%2Fstandards.nasa.gov%2Fsites%2Fdefault%2Ffiles%2Fstandards%2FNASA%2FC%2F2022-04-08-NASA-STD-3001-Vol-2-Rev-C-Final.pdf&usg=AOvVaw0ZHfpQxf-IoaHViVVZEFVp&opi=89978449
//
//  Capabilities:
//    - Zero-G Orbital Assembly & Deployable Tooling
//    - Part & Vessel Printing Draw: 50 kW (50 EC/s continuous)   [REBALANCED: was 25 kW]
//    - Runtime on internal battery: ~16 seconds continuous printing (lowest of the three)
//    - Plasma Reclamation Draw: 22 kW (22 EC/s continuous)   [REBALANCED: was 15 kW]
//    - Max Recycling Reach: 500 m
//    - Max Print Envelope: 25 m x 25 m x 50 m
//
//  Internal Operational Buffer:
//    - Regolith: 200 units (~320 kg raw feedstock)
//    - Metal: 25 units (~195 kg structural alloy)
//    - Aluminium: 35 units (~97 kg lightweight truss alloy)
//    - Polymers: 15 units (~15 kg composite stock)
//    - Lead: 15 units (~170 kg reactor/crew orbital shielding)
//    - Silicon: 10 units (~23 kg avionics feedstock)
//    - RareMetals: 5 units (~39 kg trace elements)
//
//  REBALANCE RATIONALE:
//    Like MAP-75, this is treated as grid/bus-powered equipment rather than a
//    standalone unit — high draw relative to its size, negligible internal
//    reserve, and the shortest independent runtime of all three parts.
// =================================================================================

@PART[konstructionManipulator]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True
    @rescaleFactor = 1.6
    @title = Orbital Assembly System Manipulator Arm (OAS-Arm)
    @manufacturer = MDA / Canadian Space Agency
    @description = A heavy-duty orbital assembly manipulator arm designed for zero-g spacecraft construction, station expansion, and satellite reclamation. Equipped with high-power sintering optics, plasma cutters, and integrated wireless logistics, it utilizes lightweight aluminium framing, steel, lead radiation shielding, polymers, and silicon to assemble whole vessels in space. Like its real-world analogues, it relies on a host station's power bus rather than significant onboard reserves.

    @category = Utility
    %mass = 1.2
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 12
    %breakingForce = 600
    %breakingTorque = 600

    // Strip stock EL launchpad functionality - WBIShipwright handles spawning instead
    !MODULE[ELLaunchpad],* {}
    !MODULE[ELTarget],* {}

    RESOURCE
    {
        name = ElectricCharge
        amount = 800
        maxAmount = 800
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 200 
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 25 
    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 35 
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 15 
    }
    RESOURCE
    {
        name = Lead
        amount = 0
        maxAmount = 15 
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 10 
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 5 
    }

    MODULE
    {
        name = WBIPrinterArm
        animationName = Deploy 
    }

    MODULE
    {
        name = WBIPrinterRequirements
    }

    MODULE
    {
        name = WBIModuleBoundingBox
    }

    MODULE
    {
        name = WBIResourceDistributor
        distributionRange = 500
        distributionMode = Both
    }

    @MODULE[WBIPrintShop]
    {
        printSpeedUSec = 0.000004
        UseSpecialistBonus = true

        printShopGUIName = Orbital Doackyard
        printShopwGroupDisplayName = Orbital Doackyard
        printShopDialogTitle = Orbital Doackyard

        @RESOURCE[ElectricCharge]
        {
            @rate = 50.0
        }
    }

    @MODULE[WBIShipwright]
    {
        printSpeedUSec = 0.000004
        repositionCraftBeforeSpawning = True

        @RESOURCE[ElectricCharge]
        {
            @rate = 50.0
        }
    }

    @MODULE[WBIShipbreaker]
    {
        recycleSpeedUSec = 0.35
        recyclePercentage = 0.60
        maxBuildingDistance = 500

        @RESOURCE[ElectricCharge]
        {
            @rate = 22.0
        }
    }
}