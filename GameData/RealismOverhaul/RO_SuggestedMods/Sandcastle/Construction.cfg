// =================================================================================
//  Automated Additive Manufacturing Facility (2.5m AMF)
//  High-Precision Additive Manufacturing Unit
//
//  Dry Mass: 2,500 kg
//  Diameter: 2.5 m
//  EC Storage: 50,000 EC
//
//  Primary Tech Analogue:
//    - NASA In-Space Manufacturing (ISM) Project & MSEE (Moon to Mars Planetary Autonomous Construction)
//
//  Literature & Sources:
//    - https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
//    - https://www.nasa.gov/wp-content/uploads/2015/03/nwerkheiser_lsii_oct2019_508.pdf
//    - https://ntrs.nasa.gov/api/citations/20220005590/downloads/UK_ADDITIVE%20WORLD_4.20.2022%20%20FINAL.pdf
//
//  Printer Properties (WBIPrintShop / WBIShipwright):
//    - Power Draw: 35 kW (35 EC/s continuous during active print jobs)
//      [Ref: ~30-40 kW high-efficiency fiber laser array for Laser Powder Bed Fusion / Direct Energy Deposition]
//    - Primary Input Materials: Regolith Feedstock, Metal, Aluminium, Polymers, Silicon, RareMetals
//
//  Recycler Properties (WBIShipbreaker):
//    - Power Draw: 15 kW (15 EC/s during reclamation)
//      [Ref: Plasma arc / induction furnace melt power for metal/regolith slag reclamation]
//    - Recovery Yield: 85% mass recovery to storage buffers
//
//  Internal Operational Buffer:
//    - Regolith: 500 units (~800 kg raw feedstock @ ~1.6 t/m^3 bulk density)
//    - Metal: 25 units (~195 kg structural alloy)
//    - Aluminium: 30 units (~83 kg structural alloy @ 2.7 g/cm^3)
//    - Polymers: 50 units (~50 kg resin/composite feedstock)
//    - Silicon: 40 units (~93 kg substrate stock)
//    - RareMetals: 10 units (~78 kg microelectronics/specialty alloys)
// =================================================================================

@PART[wbiELSandcaster]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Automated Additive Manufacturing Facility (2.5m AMF)
    @manufacturer = NASA / JPL
    @description = An automated, closed-loop 2.5-meter additive manufacturing unit designed for off-world infrastructure construction. Utilizing high-power laser powder-bed fusion, it sinters raw regolith feedstocks, refined metallic alloys, polymers, and silicon substrates directly into precision components and vessel assemblies without requiring direct human intervention.
    %mass = 2.5
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001

    // --- Structural ---
    %crashTolerance = 10
    %breakingForce = 250
    %breakingTorque = 250
    !MODULE[ELConverter],* {}
    !MODULE[ELWorkshop],* {}
    !MODULE[ELSurveyStation],* {}
    !MODULE[ELRecycler],* {}

    !RESOURCE[RocketParts] {}
    !RESOURCE[Metal] {}

    RESOURCE
    {
        name = ElectricCharge
        amount = 50000
        maxAmount = 50000
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 500 // ~800 kg raw regolith feed
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 25 // ~195 kg refined metal
    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 30 // ~83 kg aluminium
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 50 // ~50 kg polymer resin
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 40 // ~93 kg silicon feedstock
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 10 // ~78 kg rare metals
    }
    
    MODULE
    {
        name = ModuleCommand
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 // Tiny trickle draw for standby avionics (~50 W)
        }
    }
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        packetInterval = 0.1
        packetSize = 2
        packetResourceCost = 0.05
        requiredResource = ElectricCharge
        antennaPower = 100000000 // 100,000 km range (Cislunar Link)
        antennaCombinable = True
    }

    MODULE:NEEDS[RealAntennas]
    {
        name = ModuleRealAntenna
        antennaDiameter = 1.0 // 1.0m integrated S-band phased array
        RFBand = S
    }
    
    // --- Sandcastle Printer Arm Deployment Control ---
    @MODULE[WBIPrinterArm]
    {
        @animationName = Deploy // Links printing state to deployed arm
    }

    // --- Sandcastle Part Printer (WBIPrintShop) ---
    @MODULE[WBIPrintShop]
    {
        @maxPrintVolume = 11000 // In liters (packedVolume equivalent); -1 for unlimited
        @printSpeedUSec = 0.25 // Production units per second
        @UseSpecialistBonus = True
        enablePartSpawn = true

        @RESOURCE[ElectricCharge]
        {
            @rate = 35.0 // ~35 kW laser/electron-beam sintering power
        }

        CATEGORY_WHITELIST
        {  
            whitelistedCategory = Pods
            whitelistedCategory = Structural
            whitelistedCategory = Payload
            whitelistedCategory = Thermal
            whitelistedCategory = Fuel Tanks
            whitelistedCategory = Robotics
            whitelistedCategory = Ground
            whitelistedCategory = Electrical
            whitelistedCategory = Control
            whitelistedCategory = Communication
            whitelistedCategory = Aero
        }
    }

    MODULE
    {
        name = WBIResourceDistributor
        distributionRange = 100
        distributionMode = Both
    }

    // --- Sandcastle Vessel Printer (WBIShipwright) ---
    @MODULE[WBIShipwright]
    {
        @spawnTransformName = LaunchPos
        @maxCraftDimensions = 15,15,30 // Maximum printable envelope (X, Y, Z meters)
        @printSpeedUSec = 0.25

        @RESOURCE[ElectricCharge]
        {
            @rate = 35.0 // ~35 kW continuous printing power
        }
    }

    // --- Sandcastle Vessel Recycler (WBIShipbreaker) ---
    @MODULE[WBIShipbreaker]
    {
        @recyclePercentage = 0.85 // 85% material reclamation yield
        @recycleSpeedUSec = 0.5   // Mass processing rate
        @maxBuildingDistance = 50
        
        @RESOURCE[ElectricCharge]
        {
            @rate = 15.0 // ~15 kW plasma cutting & reclamation power
        }
    }
}


// =================================================================================
//  Off-World Modular Assembly Platform (MAP-75)
//
//  Dry Mass: 5,400 kg
//  Grid Footprint: 7.5 m x 7.5 m base (expandable via grid variants)
//  EC Storage: 20,000 EC
//  Logistics: WBIResourceDistributor (500m wireless resource pull radius)
//  Comms: Integrated S-Band Phased Array (Lunar Distance Link / ~1.0m Equivalent)
//
//
//  Literature & Sources:
//    - https://ntrs.nasa.gov/api/citations/20220009310/downloads/NSMMS_2022.pdf
//    - https://www.nasa.gov/wp-content/uploads/2015/03/nwerkheiser_lsii_oct2019_508.pdf
//    - https://ntrs.nasa.gov/api/citations/20220005590/downloads/UK_ADDITIVE%20WORLD_4.20.2022%20%20FINAL.pdf
//
//  Construction Capabilities:
//    - Part & Vessel Printing Draw: 90 kW (90 EC/s continuous)
//      [Ref: Multi-head industrial laser sintering array + vacuum electron beam deposition]
//    - Recycling Power Draw: 40 kW (40 EC/s continuous)
//    - Max Print Dimensions: 45 m x 45 m x 90 m envelope
//
//  Internal Storage Buffers:
//    - Regolith: 2,000 units (~3,200 kg raw feedstock)
//    - Metal: 200 units (~1,560 kg structural alloy)
//    - Aluminium: 150 units (~415 kg structural aluminium)
//    - Polymers: 50 units (~50 kg synthetic stock)
//    - Lead: 100 units (~1,134 kg radiation shielding / ballast @ 11.34 g/cm^3)
//    - Silicon: 30 units (~70 kg electronics substrate)
//    - RareMetals: 40 units (~312 kg trace elements)
// =================================================================================

@PART[yardFrameFlat75]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Off-World Modular Assembly Platform (MAP-75)
    @manufacturer = Boeing / Lockheed Martin
    @description = A scaled-up 7.5-meter modular structural truss designed as a heavy foundation for large off-world orbital launches and planetary landing zones. Fitted with high-power multi-beam laser sintering arrays, automated plasma cutters, and long-range wireless logistics feeds for full-scale surface vessel and outpost fabrication utilizing metal, aluminium, lead shielding, polymers, and silicon.
    %rescaleFactor = 1.0
    @category = Utility
    %mass = 5.4
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85
    %heatConductivity = 0.001
    %crashTolerance = 20
    %breakingForce = 2500
    %breakingTorque = 2500

    @MODULE[WBIModulePartGridVariants]
    {
        @elementLength = 7.5
        @elementWidth = 7.5
        @elementHeight = 0.3
    }

    // --- Internal Operational Storage ---
    RESOURCE
    {
        name = ElectricCharge
        amount = 20000
        maxAmount = 20000
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 2000 // ~3,200 kg raw feed
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 200 // ~1,560 kg metal
    }
    RESOURCE
    {
        name = Aluminium
        amount = 0
        maxAmount = 150 // ~415.5 kg aluminium
    }
    RESOURCE
    {
        name = Polymers
        amount = 0
        maxAmount = 50 // ~50 kg polymers
    }
    RESOURCE
    {
        name = Lead
        amount = 0
        maxAmount = 100 // ~1,134 kg lead radiation shielding
    }
    RESOURCE
    {
        name = Silicon
        amount = 0
        maxAmount = 30 // ~70 kg silicon
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 40 // ~312 kg rare metals
    }

    // --- Standalone Avionics & Command ---
    MODULE
    {
        name = ModuleCommand
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05 // Tiny trickle draw for standby avionics (~50 W)
        }
    }

    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        packetInterval = 0.1
        packetSize = 2
        packetResourceCost = 0.05
        requiredResource = ElectricCharge
        antennaPower = 100000000 // 100,000 km range (Cislunar Link)
        antennaCombinable = True
    }

    MODULE:NEEDS[RealAntennas]
    {
        name = ModuleRealAntenna
        antennaDiameter = 1.0 // 1.0m integrated S-band phased array
        RFBand = S
    }

    // --- Sandcastle Helper Modules ---
    MODULE
    {
        name = WBIPrinterRequirements
    }

    MODULE
    {
        name = WBIModuleFuelPump
    }

    MODULE
    {
        name = WBIModuleBoundingBox
    }

    // --- Wireless Logistics & Proximity Resource Sharing ---
    MODULE
    {
        name = WBIResourceDistributor
        distributionRange = 50
        distributionMode = Both
    }

    // --- Native Sandcastle Part Printer (WBIPrintShop) ---
    MODULE
    {
        name = WBIPrintShop
        maxPrintVolume = -1 // Unlimited part printing volume
        printSpeedUSec = 0.75
        UseSpecialistBonus = True

        enablePartSpawn = true
        spawnTransformName = node_stack_top

        printShopGUIName = Print Heavy Part
        printShopwGroupDisplayName = Heavy Part Printer
        printShopDialogTitle = Heavy Part Printer

        RESOURCE
        {
            name = ElectricCharge
            rate = 90.0 // ~90 kW multi-laser sintering power
        }
    }

    // --- Native Sandcastle Vessel Printer (WBIShipwright) ---
    MODULE
    {
        name = WBIShipwright
        printSpeedUSec = 0.75
        UseSpecialistBonus = True
        spawnTransformName = node_stack_top
        maxCraftDimensions = 45,45,90
        repositionCraftBeforeSpawning = True

        RESOURCE
        {
            name = ElectricCharge
            rate = 90.0 // ~90 kW continuous printing power
        }
    }

    // --- Native Sandcastle Vessel Recycler (WBIShipbreaker) ---
    MODULE
    {
        name = WBIShipbreaker
        recycleSpeedUSec = 0.75
        recyclePercentage = 0.85
        UseSpecialistBonus = True
        maxBuildingDistance = 50

        RESOURCE
        {
            name = ElectricCharge
            rate = 40.0 // ~40 kW heavy plasma cutting power
        }
    }
}


// =================================================================================
