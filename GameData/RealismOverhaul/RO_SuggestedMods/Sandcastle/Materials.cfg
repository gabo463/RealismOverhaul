// =================================================================================
//  Sandcastle Realism-Tuned Category Material Lists (CRP Expanded)
//  
//  Material Allocation Rules:
//   - Regolith:   Raw/sintered feedstock for bulk structure, radiation shielding, containers.
//   - Metal:      Heavy structural alloys, heat exchangers, pressure shells, engine chambers.
//   - Aluminium:  Lightweight structural frames, engine housings, tanks, trusses.
//   - RareMetals: Microchips, sensors, high-spec wiring, exotic alloys.
//   - Silicon:    Semiconductors, photovoltaics, optics, electronic substrates.
//   - Polymers:   Wiring insulation, thermal gaskets, pressure seals, composite fairings.
//   - Lead:       Heavy radiation shielding for crew quarters and command pods.
//
//  Mass Fraction Rule: Resource 'rate' values in each block sum to 1.0 (100%).
// =================================================================================

