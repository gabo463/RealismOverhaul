// =================================================================================
//  Sandcastle Realism-Tuned Category Material Lists
//  
//  Material Allocation Rules:
//   - Regolith: Raw/sintered feedstock for bulk structure, radiation shielding, containers.
//   - Metal: Structural alloys, heat exchangers, pressure shells, engine chambers.
//   - RareMetals: Microchips, sensors, wiring, photovoltaics, exotic alloys.
//
//  Mass Fraction Rule: Resource 'rate' values in each block sum to 1.0 (100%).
// =================================================================================

// --- Default Fallback ---
MATERIALS_LIST
{
	name = Default
	
	RESOURCE
	{
		name = Regolith
		rate = 0.50
	}
	RESOURCE
	{
		name = Metal
		rate = 0.40
	}
	RESOURCE
	{
		name = RareMetals
		rate = 0.10
	}
}

