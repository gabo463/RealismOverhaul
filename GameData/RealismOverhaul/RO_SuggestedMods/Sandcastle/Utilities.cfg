// =================================================================================
//  Construction Yard Floodlight Array (wbiYardLight)
//  High-Intensity Worksite & Shipyard Illuminator
//
//  Dry Mass: 80 kg (0.08 t)
//  EC Draw: 1.5 kW (1.5 EC/s) when fully illuminated
// =================================================================================

@PART[wbiYardLight]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Construction Yard Floodlight Array
    @manufacturer = General Electric / NASA
    @description = A heavy-duty, high-lux floodlight fixture engineered specifically for deep-space assembly yards, station trusses, and planetary construction sites. Features an integrated multi-element LED optics bank designed to illuminate large craft structures and work envelopes during dark orbital passes.

    @category = Utility

    // --- Mass & Thermal Limits ---
    %mass = 0.08
    %maxTemp = 1500
    %skinMaxTemp = 1500
    %emissiveConstant = 0.85
    %heatConductivity = 0.001

    // --- Structural ---
    %crashTolerance = 10
    %breakingForce = 150
    %breakingTorque = 150

    // --- Lighting Energy Consumption ---
    @MODULE[ModuleLight]
    {
        @resourceAmount = 1.5 // ~1.5 kW active draw for high-intensity yard floodlights
    }
}

// =================================================================================
//  Off-World Construction Alignment Marker (konstructionMarker)
//  High-Precision Optical & RF Survey Marker
//
//  Dry Mass: 15 kg (0.015 t)
//  EC Draw: 0.02 kW (20 W continuous telemetry/beacon draw)
// =================================================================================

@PART[konstructionMarker]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Off-World Construction Alignment Marker
    @manufacturer = NASA / JPL
    @description = A lightweight optical and radio-frequency survey beacon used to establish precise offset origins, boundary coordinates, and target vectors for off-world additive manufacturing facilities, landing pad grids, and orbital shipyards.

    @category = Utility

    // --- Mass & Thermal Limits ---
    %mass = 0.015
    %maxTemp = 1500
    %skinMaxTemp = 1500
    %emissiveConstant = 0.85
    %heatConductivity = 0.001

    // --- Structural ---
    %crashTolerance = 10
    %breakingForce = 100
    %breakingTorque = 100

    // --- Strip Extraplanetary Launchpads Legacy Modules ---
    !MODULE[ELSurveyPoint],* {}
    !MODULE[ELSurveyStation],* {}

    // --- Integrated Internal Energy Buffer ---
    RESOURCE
    {
        name = ElectricCharge
        amount = 100
        maxAmount = 100
    }

    // --- Sandcastle / WBI Bounding & Alignment Helper ---
    MODULE
    {
        name = WBIModuleBoundingBox
    }
}