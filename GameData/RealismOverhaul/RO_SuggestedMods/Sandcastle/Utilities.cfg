// =================================================================================
//  Heavy Off-World Logistics Container (2.5m ISRU Storage)
//  Sandcastle 2.5m Construction Resource Container (rocketPartsContainerMid)
//  RealFuels Integration & Modular Dry Logistics
//
//  Dry Mass: 750 kg
//  Diameter: 2.5 m
//  Height: 1.875 m
//  Tank Volume: 6,000 L (6.0 m³)
//  Tank System: RealFuels (ModuleFuelTanks)
//
//  Supported Resources & Storage Capacities (at 100% volume allocation):
//    - Regolith:   6,000 units (~9,600 kg)   [Density: 1.6 kg/L]     [1]
//    - Metal:      6,000 units (~46,800 kg)  [Density: 7.8 kg/L]     [2]
//    - RareMetals: 6,000 units (~46,800 kg)  [Density: 7.8 kg/L]     [2]
//
//  Fully dynamic volume allocation via RealFuels UI in VAB/SPH.
//
//  TECHNICAL REFERENCES:
//  [1] Community Resource Pack (CRP) Regolith Density Standard (1.6 kg/L).
//  [2] Community Resource Pack (CRP) Metal & RareMetals Density Standard (7.8 kg/L).
// =================================================================================

@PART[rocketPartsContainerMid]:NEEDS[RealismOverhaul,RealFuels]
{
    %RSSROConfig = True

    @title = Heavy Off-World Logistics Container (2.5m ISRU Storage)
    @manufacturer = Boeing / Lockheed Martin
    @description = A reinforced 2.5m structural containment module engineered for long-term off-world resource logistics and storage. Integrated with RealFuels (ModuleFuelTanks), it allows dynamic operational volume allocation between raw feedstock (Regolith), processed structural alloys (Metal), and high-density electronic or refractory elements (RareMetals).

    // --- Physical & Thermal Parameters ---
    %mass = 0.75
    %maxTemp = 2000
    %skinMaxTemp = 2000
    %emissiveConstant = 0.85

    // --- Structural Tolerances ---
    %crashTolerance = 12
    %breakingForce = 250
    %breakingTorque = 250

    // --- Remove Default Stock/Sandcastle Resources & B9 Switches ---
    !RESOURCE[RocketParts] {}
    !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[cargoSelect]] {}
    !MODULE[ModuleFuelTanks] {}

    // --- RealFuels Integration ---
    MODULE
    {
        name = ModuleFuelTanks
        volume = 6000
        type = ServiceModule
        basemass = -1

        // Allowed resources explicitly configured for the tank
        TANK
        {
            name = Regolith
            amount = 0
            maxAmount = 0
        }
        TANK
        {
            name = Metal
            amount = 0
            maxAmount = 0
        }
        TANK
        {
            name = RareMetals
            amount = 0
            maxAmount = 0
        }
    }
}

// =================================================================================
//  Construction Yard Floodlight Array (wbiYardLight)
//  High-Intensity Worksite & Shipyard Illuminator
//
//  Dry Mass: 80 kg (0.08 t)
//  EC Draw: 1.5 kW (1.5 EC/s) when fully illuminated
// =================================================================================

@PART[wbiYardLight]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Construction Yard Floodlight Array
    @manufacturer = General Electric / NASA
    @description = A heavy-duty, high-lux floodlight fixture engineered specifically for deep-space assembly yards, station trusses, and planetary construction sites. Features an integrated multi-element LED optics bank designed to illuminate large craft structures and work envelopes during dark orbital passes.

    @category = Utility

    // --- Mass & Thermal Limits ---
    %mass = 0.08
    %maxTemp = 1500
    %skinMaxTemp = 1500
    %emissiveConstant = 0.85
    %heatConductivity = 0.001

    // --- Structural ---
    %crashTolerance = 10
    %breakingForce = 150
    %breakingTorque = 150

    // --- Lighting Energy Consumption ---
    @MODULE[ModuleLight]
    {
        @resourceAmount = 1.5 // ~1.5 kW active draw for high-intensity yard floodlights
    }
}

// =================================================================================
//  Off-World Construction Alignment Marker (konstructionMarker)
//  High-Precision Optical & RF Survey Marker
//
//  Dry Mass: 15 kg (0.015 t)
//  EC Draw: 0.02 kW (20 W continuous telemetry/beacon draw)
// =================================================================================

@PART[konstructionMarker]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Off-World Construction Alignment Marker
    @manufacturer = NASA / JPL
    @description = A lightweight optical and radio-frequency survey beacon used to establish precise offset origins, boundary coordinates, and target vectors for off-world additive manufacturing facilities, landing pad grids, and orbital shipyards.

    @category = Utility

    // --- Mass & Thermal Limits ---
    %mass = 0.015
    %maxTemp = 1500
    %skinMaxTemp = 1500
    %emissiveConstant = 0.85
    %heatConductivity = 0.001

    // --- Structural ---
    %crashTolerance = 10
    %breakingForce = 100
    %breakingTorque = 100

    // --- Strip Extraplanetary Launchpads Legacy Modules ---
    !MODULE[ELSurveyPoint],* {}
    !MODULE[ELSurveyStation],* {}

    // --- Integrated Internal Energy Buffer ---
    RESOURCE
    {
        name = ElectricCharge
        amount = 100
        maxAmount = 100
    }

    // --- Sandcastle / WBI Bounding & Alignment Helper ---
    MODULE
    {
        name = WBIModuleBoundingBox
    }
}