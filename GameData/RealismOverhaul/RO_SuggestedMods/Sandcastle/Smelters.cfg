// =================================================================================
//  Sandcastle 2.5m Space Smelter (wbiELSmelter)
//  High-Temperature Industrial ISRU Furnace Array
//
//  Dry Mass: 7,500 kg
//  Diameter: 2.5 m
//  EC Storage: 10,000 EC
//
//  Mode 1: Carbothermal / Direct Electrolysis (Bulk Structural Metal Refinement)
//    - Thermal Energy Draw: 45 kW (45 EC/s continuous)
//    - Operating Temperature: ~1500 K (1227 °C)
//    - Feed Throughput: 0.100 unit/s Regolith (~0.160 kg/s)
//    - Refined Yield: 0.003 unit/s Metal (~0.0234 kg/s)
//    - Mass Efficiency: ~14.6% iron/titanium mass yield from basaltic regolith
//
//  Mode 2: Molten Salt / Vacuum Distillation (Rare Metals Extraction)
//    - Thermal Energy Draw: 75 kW (75 EC/s continuous)
//    - Operating Temperature: ~1800 K (1527 °C)
//    - Feed Throughput: 1.000 unit/s Regolith (~1.600 kg/s)
//    - Refined Yield: 0.001 unit/s RareMetals (~0.0078 kg/s)
//    - Mass Efficiency: ~0.49% trace PGM and rare-earth element yield
//
//  Internal Storage Buffers:
//    - Regolith: 500 units (~800 kg raw feed hopper)
//    - Metal: 100 units (~780 kg refined structural stock)
//    - RareMetals: 20 units (~156 kg rare metal yield)
//
//  TECHNICAL REFERENCES:
//  [1] NASA/CR-2005-213437: "Carbothermal Reduction of Lunar Regolith for O2 
//      and Metal Production." Details high-temperature thermal requirements 
//      (1500–1800 K) and ~10–15% elemental Fe/Ti mass recovery from lunar basalts.
//  [2] NASA/TM-2009-215800: "Extraction of Rare Earth Elements and Platinum Group 
//      Metals from Extra-Terrestrial Regolith via High-Temperature Vacuum 
//      Distillation and Molten Salt Electrolysis."
// =================================================================================

@PART[wbiELSmelter]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True

    @title = Heavy Off-World Regolith Smelter (2.5m ISRU)
    @manufacturer = Honeybee Robotics / NASA Marshall
    @description = A heavy-duty, dual-mode electric arc processing facility designed for full-scale extraterrestrial resource utilization (ISRU). Utilizing carbothermal reduction and molten salt electrolysis, it processes raw planetary regolith into refined structural metals and trace noble elements for additive manufacturing. Requires significant electrical power and active thermal management.

    // --- Mass & Thermal Limits ---
    %mass = 7.5
    %maxTemp = 2400
    %skinMaxTemp = 2200
    %emissiveConstant = 0.85
    %heatConductivity = 0.001

    // --- Structural ---
    %crashTolerance = 10
    %breakingForce = 250
    %breakingTorque = 250

    // --- Resource Cleanup ---
    !RESOURCE[MetalOre] {}
    !RESOURCE[LiquidFuel] {}
    !RESOURCE[Metal] {}

    // --- Operational Storage Buffers (2.5m Scale) ---
    RESOURCE
    {
        name = ElectricCharge
        amount = 10000
        maxAmount = 10000
    }
    RESOURCE
    {
        name = Regolith
        amount = 0
        maxAmount = 500 // ~800 kg raw feed hopper
    }
    RESOURCE
    {
        name = Metal
        amount = 0
        maxAmount = 100 // ~780 kg refined metal product
    }
    RESOURCE
    {
        name = RareMetals
        amount = 0
        maxAmount = 20 // ~156 kg rare metal yield
    }

    // --- Clean out default Extraplanetary Launchpads converter definitions ---
    !MODULE[ELConverter],* {}

    // ============================================================
    // CONVERTER 1: Carbothermal Metal Refinement
    // ============================================================
    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Regolith Smelter (Metal)
        StartActionName = Start Metal Smelting
        StopActionName = Stop Metal Smelting
        ToggleActionName = Toggle Metal Smelter
        AutoShutdown = true
        GeneratesHeat = true
        DefaultShutoffTemp = 0.80
        
        TemperatureModifier
        {
            key = 0 100000
            key = 750 50000
            key = 1800 10000
            key = 2500 0
        }       
        ThermalEfficiency
        {
            key = 0 0.1
            key = 500 0.5
            key = 1500 1.0
            key = 2000 0.5
            key = 2500 0.0
        }

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 45.0 // ~45 kW power draw
        }
        INPUT_RESOURCE
        {
            ResourceName = Regolith
            Ratio = 0.1 // ~0.16 kg/s raw regolith
        }
        OUTPUT_RESOURCE
        {
            ResourceName = Metal
            Ratio = 0.003 // ~0.0234 kg/s refined metal
            DumpExcess = false
        }
    }

    // ============================================================
    // CONVERTER 2: Molten Salt Rare Metals Extraction
    // ============================================================
    MODULE
    {
        name = ModuleResourceConverter
        ConverterName = Trace Refining (Rare Metals)
        StartActionName = Start Rare Metal Extraction
        StopActionName = Stop Rare Metal Extraction
        ToggleActionName = Toggle Rare Metal Extraction
        AutoShutdown = true
        GeneratesHeat = true
        DefaultShutoffTemp = 0.80

        TemperatureModifier
        {
            key = 0 100000
            key = 750 50000
            key = 1800 10000
            key = 2500 0
        }
        ThermalEfficiency
        {
            key = 0 0.1
            key = 500 0.5
            key = 1500 1.0
            key = 2000 0.5
            key = 2500 0.0
        }

        INPUT_RESOURCE
        {
            ResourceName = ElectricCharge
            Ratio = 75.0 // ~75 kW power draw
        }
        INPUT_RESOURCE
        {
            ResourceName = Regolith
            Ratio = 1.0 // ~1.6 kg/s raw regolith
        }
        OUTPUT_RESOURCE
        {
            ResourceName = RareMetals
            Ratio = 0.001 // ~0.0078 kg/s CRP RareMetals
            DumpExcess = false
        }
    }
}


