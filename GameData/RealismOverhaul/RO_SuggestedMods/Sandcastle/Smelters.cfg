// =================================================================================
//  Sandcastle 2.5m Space Smelter (wbiELSmelter)
//  Includes Route 2: Regolith Volatile Pyrolysis & Polymer Hydrogenation
//
//  Dry Mass: 7,500 kg
//  Diameter: 2.5 m
//  EC Storage: 10,000 EC
//
//  Mode 1: Carbothermal / Direct Electrolysis (Bulk Structural Metal Refinement)
//    - Thermal Energy Draw: 45 kW (45 EC/s continuous)
//    - Operating Temperature: ~1500 K (1227 °C)
//    - Feed Throughput: 0.100 unit/s Regolith (~0.160 kg/s)
//    - Refined Yield: 0.003 unit/s Metal (~0.0234 kg/s)
//
//  Mode 2: Molten Salt / Vacuum Distillation (Rare Metals Extraction)
//    - Thermal Energy Draw: 75 kW (75 EC/s continuous)
//    - Operating Temperature: ~1800 K (1527 °C)
//    - Feed Throughput: 1.000 unit/s Regolith (~1.600 kg/s)
//    - Refined Yield: 0.001 unit/s RareMetals (~0.0078 kg/s)
//
//  Mode 3: Carbothermal Silicate Reduction (Silicon Refinement)
//    - Thermal Energy Draw: 60 kW (60 EC/s continuous)
//    - Operating Temperature: ~1700 K (1427 °C)
//    - Feed Throughput: 0.200 unit/s Regolith (~0.320 kg/s)
//    - Refined Yield: 0.020 unit/s Silicon (~0.0466 kg/s)
//
//  Mode 4: Molten Salt Anode Electrolysis (Aluminium Smelting)
//    - Thermal Energy Draw: 50 kW (50 EC/s continuous)
//    - Operating Temperature: ~1250 K (977 °C)
//    - Feed Throughput: 0.150 unit/s Regolith (~0.240 kg/s)
//    - Refined Yield: 0.012 unit/s Aluminium (~0.0332 kg/s)
//
//  Mode 5: Regolith Volatile Pyrolysis (Polymers) [Route 2]
//    - Thermal Energy Draw: 35 kW (35 EC/s continuous)
//    - Operating Temperature: ~900 K (627 °C)
//    - Feed Throughput: 0.3125 unit/s Regolith (~0.500 kg/s) + 0.0005 unit/s Water
//    - Refined Yield: 0.0005 unit/s Polymers (~0.0005 kg/s) + 0.80 unit/s Oxygen byproduct
//
//  Mode 6: Low-Temperature Heavy Metal Reduction (Lead Smelting)
//    - Thermal Energy Draw: 35 kW (35 EC/s continuous)
//    - Operating Temperature: ~900 K (627 °C)
//    - Feed Throughput: 0.100 unit/s Regolith (~0.160 kg/s)
//    - Refined Yield: 0.001 unit/s Lead (~0.01134 kg/s)
// =================================================================================

@PART[wbiELSmelter]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True

	@title = Heavy Off-World Regolith Smelter & Chemical Processor (2.5m ISRU)
	@manufacturer = Honeybee Robotics / NASA Marshall
	@description = A heavy-duty, six-mode electric arc processing facility designed for full-scale extraterrestrial resource utilization (ISRU). Utilizing carbothermal reduction, molten salt electrolysis, regolith pyrolysis hydrogenation, and heavy metal reduction, it processes raw planetary regolith and supplemental water into refined structural metals, silicon substrates, structural aluminium, polymers, lead shielding, oxygen, and trace noble elements.

	// --- Mass & Thermal Limits ---
	%mass = 7.5
	%maxTemp = 2400
	%skinMaxTemp = 2200
	%emissiveConstant = 0.85
	%heatConductivity = 0.001

	// --- Structural ---
	%crashTolerance = 10
	%breakingForce = 250
	%breakingTorque = 250

	// --- Resource Cleanup ---
	!RESOURCE[MetalOre] {}
	!RESOURCE[LiquidFuel] {}
	!RESOURCE[Metal] {}

	// --- Operational Storage Buffers (2.5m Scale) ---
	RESOURCE
	{
		name = ElectricCharge
		amount = 10000
		maxAmount = 10000
	}

	RESOURCE
	{
		name = Regolith
		amount = 0
		maxAmount = 500
	}

	RESOURCE
	{
		name = Metal
		amount = 0
		maxAmount = 100
	}

	RESOURCE
	{
		name = RareMetals
		amount = 0
		maxAmount = 20
	}

	RESOURCE
	{
		name = Silicon
		amount = 0
		maxAmount = 100
	}

	RESOURCE
	{
		name = Aluminium
		amount = 0
		maxAmount = 150
	}

	RESOURCE
	{
		name = Polymers
		amount = 0
		maxAmount = 100
	}

	RESOURCE
	{
		name = Lead
		amount = 0
		maxAmount = 50
	}

	RESOURCE
	{
		name = Water
		amount = 0
		maxAmount = 50
	}

	RESOURCE
	{
		name = Oxygen
		amount = 0
		maxAmount = 1000
	}

	// --- Clean out default Extraplanetary Launchpads converter definitions ---
	!MODULE[ELConverter],* {}

	// ============================================================
	// CONVERTER 1: Carbothermal Metal Refinement
	// ============================================================
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Regolith Smelter (Metal)
		StartActionName = Start Metal Smelting
		StopActionName = Stop Metal Smelting
		ToggleActionName = Toggle Metal Smelter
		AutoShutdown = true
		GeneratesHeat = true
		DefaultShutoffTemp = 0.80

		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1800 10000
			key = 2500 0
		}

		ThermalEfficiency
		{
			key = 0 0.1
			key = 500 0.5
			key = 1500 1.0
			key = 2000 0.5
			key = 2500 0.0
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 45.0
		}

		INPUT_RESOURCE
		{
			ResourceName = Regolith
			Ratio = 0.100
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Metal
			Ratio = 0.003
			DumpExcess = false
		}
	}

	// ============================================================
	// CONVERTER 2: Molten Salt Rare Metals Extraction
	// ============================================================
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Trace Refining (Rare Metals)
		StartActionName = Start Rare Metal Extraction
		StopActionName = Stop Rare Metal Extraction
		ToggleActionName = Toggle Rare Metal Extraction
		AutoShutdown = true
		GeneratesHeat = true
		DefaultShutoffTemp = 0.80

		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1800 10000
			key = 2500 0
		}

		ThermalEfficiency
		{
			key = 0 0.1
			key = 500 0.5
			key = 1500 1.0
			key = 2000 0.5
			key = 2500 0.0
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 75.0
		}

		INPUT_RESOURCE
		{
			ResourceName = Regolith
			Ratio = 1.000
		}

		OUTPUT_RESOURCE
		{
			ResourceName = RareMetals
			Ratio = 0.001
			DumpExcess = false
		}
	}

	// ============================================================
	// CONVERTER 3: Carbothermal Silicate Reduction (Silicon)
	// ============================================================
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Silicate Reduction (Silicon)
		StartActionName = Start Silicon Refining
		StopActionName = Stop Silicon Refining
		ToggleActionName = Toggle Silicon Refining
		AutoShutdown = true
		GeneratesHeat = true
		DefaultShutoffTemp = 0.80

		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1800 10000
			key = 2500 0
		}

		ThermalEfficiency
		{
			key = 0 0.1
			key = 500 0.5
			key = 1500 1.0
			key = 2000 0.5
			key = 2500 0.0
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 60.0
		}

		INPUT_RESOURCE
		{
			ResourceName = Regolith
			Ratio = 0.200
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Silicon
			Ratio = 0.020
			DumpExcess = false
		}
	}

	// ============================================================
	// CONVERTER 4: Molten Salt Anode Electrolysis (Aluminium)
	// ============================================================
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Alumina Electrolysis (Aluminium)
		StartActionName = Start Aluminium Smelting
		StopActionName = Stop Aluminium Smelting
		ToggleActionName = Toggle Aluminium Smelter
		AutoShutdown = true
		GeneratesHeat = true
		DefaultShutoffTemp = 0.80

		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1800 10000
			key = 2500 0
		}

		ThermalEfficiency
		{
			key = 0 0.1
			key = 500 0.5
			key = 1500 1.0
			key = 2000 0.5
			key = 2500 0.0
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 50.0
		}

		INPUT_RESOURCE
		{
			ResourceName = Regolith
			Ratio = 0.150
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Aluminium
			Ratio = 0.012
			DumpExcess = false
		}
	}

	// ============================================================
	// CONVERTER 5: Regolith Volatile Pyrolysis (Polymers) [Route 2]
	// ============================================================
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Regolith Pyrolysis (Polymers)
		StartActionName = Start Polymer Pyrolysis
		StopActionName = Stop Polymer Pyrolysis
		ToggleActionName = Toggle Polymer Pyrolysis
		AutoShutdown = true
		GeneratesHeat = true
		DefaultShutoffTemp = 0.80

		TemperatureModifier
		{
			key = 0 100000
			key = 750 50000
			key = 1200 10000
			key = 1500 0
		}

		ThermalEfficiency
		{
			key = 0 0.1
			key = 500 0.5
			key = 900 1.0
			key = 1200 0.5
			key = 1500 0.0
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 35.0
		}

		INPUT_RESOURCE
		{
			ResourceName = Regolith
			Ratio = 0.3125
		}

		INPUT_RESOURCE
		{
			ResourceName = Water
			Ratio = 0.0005
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Polymers
			Ratio = 0.0005
			DumpExcess = false
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Oxygen
			Ratio = 0.80
			DumpExcess = true
		}
	}

	// ============================================================
	// CONVERTER 6: Heavy Metal Smelting (Lead)
	// ============================================================
	MODULE
	{
		name = ModuleResourceConverter
		ConverterName = Heavy Metal Smelting (Lead)
		StartActionName = Start Lead Smelting
		StopActionName = Stop Lead Smelting
		ToggleActionName = Toggle Lead Smelter
		AutoShutdown = true
		GeneratesHeat = true
		DefaultShutoffTemp = 0.80

		TemperatureModifier
		{
			key = 0 100000
			key = 500 50000
			key = 1200 10000
			key = 1800 0
		}

		ThermalEfficiency
		{
			key = 0 0.1
			key = 400 0.5
			key = 900 1.0
			key = 1400 0.5
			key = 1800 0.0
		}

		INPUT_RESOURCE
		{
			ResourceName = ElectricCharge
			Ratio = 35.0
		}

		INPUT_RESOURCE
		{
			ResourceName = Regolith
			Ratio = 0.100
		}

		OUTPUT_RESOURCE
		{
			ResourceName = Lead
			Ratio = 0.001
			DumpExcess = false
		}
	}
}


