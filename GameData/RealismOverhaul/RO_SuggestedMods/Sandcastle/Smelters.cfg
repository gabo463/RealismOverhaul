@PART[wbiELSmelter]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True

	@title = Heavy Off-World Regolith Smelter & Chemical Processor (2.5m ISRU)
	@manufacturer = Honeybee Robotics / NASA Marshall
	@description = A heavy-duty, six-mode electric arc processing facility designed for full-scale extraterrestrial resource utilization (ISRU). Utilizing carbothermal reduction, molten salt electrolysis, regolith pyrolysis hydrogenation, and heavy metal reduction, it processes raw planetary regolith and supplemental water into refined structural metals, silicon substrates, structural aluminium, polymers, lead shielding, oxygen, and trace noble elements.

	// --- Mass & Thermal Limits ---
	%mass = 7.5
	%maxTemp = 2400
	%skinMaxTemp = 2200
	%emissiveConstant = 0.85
	%heatConductivity = 0.001

	// --- Structural ---
	%crashTolerance = 10
	%breakingForce = 250
	%breakingTorque = 250
}


// =================================================================================
//  Sandcastle 1.25m Compact Space Smelter (wbiELMiniSmelter)
//  Includes Route 2: Compact Regolith Volatile Pyrolysis (25% Scale)
// =================================================================================

@PART[wbiELMiniSmelter]:NEEDS[RealismOverhaul]
{
	%RSSROConfig = True

	@title = Compact Off-World Regolith Smelter & Chemical Processor (1.25m ISRU)
	@manufacturer = Honeybee Robotics / NASA Marshall
	@description = A scaled-down 1.25m industrial furnace and volatile processor designed for small surface outposts, mobile automated rovers, and early-phase orbital refining operations. Configured to deliver 25% throughput capacity of full-scale smelters across six distinct refining modes.

	// --- Mass & Thermal Limits ---
	%mass = 1.0

	// --- Thermal Limits ---
	%maxTemp = 2400
	%skinMaxTemp = 2200
	%emissiveConstant = 0.85
	%heatConductivity = 0.001

	// --- Structural ---
	%crashTolerance = 10
	%breakingForce = 100
	%breakingTorque = 100
}