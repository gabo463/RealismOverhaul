
// --------------------------------------------------------
// 5m Cargo Bay - Full
// --------------------------------------------------------
@PART[nflv-cargo-5-1]:FOR[RealismOverhaul] 
{
	%RSSROConfig = True
	@mass = 5.2
	@crashTolerance = 12
	@breakingForce = 250
	@breakingTorque = 250
	@maxTemp = 3600
	%skinMaxTemp = 3600
	%emissivity = 0.9
	%heatConductivity = 0.01
	%skinInternalConductionMult = 0.25
	%skinSkinConductionMult = 0.1
	%skinMassPerArea = 4.0
}

