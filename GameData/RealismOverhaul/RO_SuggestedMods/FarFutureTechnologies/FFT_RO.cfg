Reactors 
---------------------------------------------------------------------------------------------------------------------------------------------------------

//These configurations are based on research from MIT Plasma Science and Fusion Center (SPARC / ARC), PPPL, and EPR (Experimental Power Reactor) studies for continuous magnetohydrodynamic (MHD) thermal and direct energy conversion
Aneutronic D-3He Fuel Cycle:
Both reactors run primarily on an equal 50/50 mix of Liquid Deuterium and Liquid Helium-3. This fuel cycle produces negligible prompt neutrons, eliminating the need for massive lithium breeding blankets and heavy radiation shielding while allowing efficient direct energy conversion.

//Continuous Power Generation & Kickstart Overhead:
Tokamaks are not self-starting — they require a high-power initial capacitive discharge (RF heating & magnetic field ramp-up) to achieve plasma breakdown and ignition temperature (∼15–20 keV).
Once ignited, the internal direct energy converters generate steady-state electrical power (MW output) while consuming tiny fractions of cryogenic fuel per second.

//Reference: ARC: A compact, high-field, affordable, tokamak power plant (MIT Plasma Science and Fusion Center).
Journal / Citation: Fusion Engineering and Design (Vol. 100, 2015, pp. 378–405).
Authors: B. N. Sorbom, J. Ball, T. Palmer, F. Mangiarotti, et al.

//Reference: Miley, G. H. (1998). Aneutronic Fusion Power Plants and Direct Energy Conversion. AIP Conference Proceedings, Penn State Propulsion Engineering.
Data: Establishes mass-to-power scaling laws and thermal rejection burdens for steady-state D-3He magnetic confinement systems.

---------------------------------------------------------------------------------------------------------------------------------------
// Realism Overhaul configuration for Far Future Technologies 2.5m Tokamak Fusion Reactor
@PART[fft-fusion-reactor-25-1]:NEEDS[RealismOverhaul,FarFutureTechnologies]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    
    // Rescale 2.5m baseline up to 4m real-world footprint
    %rescaleFactor = 1.6
    
    @mass = 28.0 // Heavy REBCO magnetic field coils, divertor plates, and cryostat shield
    @maxTemp = 2400
    @crashTolerance = 8
    
    %category = Electrical
    
    @MODULE[FusionReactor]
    {
        @ECPower = 250000 // 250 MWs (250,000 EC) initial capacitive discharge to ignite plasma
        
        !FUSIONMODE,* {}
        
        // Mode 1: D-3He Aneutronic Cycle (High Efficiency)
        FUSIONMODE
        {
            DisplayName = D-3He Aneutronic
            ModeID = DHe3
            ModeColor = 0.388, 0.968, 1.0, 0.5
            PowerGeneration = 125000 // 125 MW continuous net electric generation
            
            INPUT_RESOURCE
            {
                ResourceName = LqdDeuterium
                Ratio = 0.00015
                FlowMode = STAGE_PRIORITY_FLOW
            }
            INPUT_RESOURCE
            {
                ResourceName = LqdHe3
                Ratio = 0.00015
                FlowMode = STAGE_PRIORITY_FLOW
            }
        }

        // Mode 2: D-T Pulsed/Thermal Cycle (Alternative High-Density Feed)
        FUSIONMODE
        {
            DisplayName = D-T Standard
            ModeID = DT
            ModeColor = 1.0, 0.5, 0.2, 0.5
            PowerGeneration = 140000 // 140 MW output
            
            INPUT_RESOURCE
            {
                ResourceName = LqdDeuterium
                Ratio = 0.00018
                FlowMode = STAGE_PRIORITY_FLOW
            }
            INPUT_RESOURCE
            {
                ResourceName = LqdTritium
                Ratio = 0.00018
                FlowMode = STAGE_PRIORITY_FLOW
            }
        }
    }
    
    @MODULE[ModuleSystemHeatProduction]:NEEDS[SystemHeat]
    {
        @heatProduction = 35000 // SystemHeat thermal rejection demand
    }
}
// Realism Overhaul configuration for Far Future Technologies  3.75m Tokamak Fusion Reactor
@PART[fft-fusion-reactor-375-1]:NEEDS[RealismOverhaul,FarFutureTechnologies]:FOR[RealismOverhaul]
