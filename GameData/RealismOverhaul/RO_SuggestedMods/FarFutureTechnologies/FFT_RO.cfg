@PART[fft-fueltank-fusion-5-1]:NEEDS[RealismOverhaul]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    
    // Rescale to match 1.6x baseline for heavy capital hulls (5m -> 8m)
    %rescaleFactor = 1.6
    
    @mass = 18.50 // Heavy structural load-bearing trusses, cryogenic insulation, and pellet loader assemblies
    @maxTemp = 2000
    @crashTolerance = 8
    
    %category = FuelTank
    
    // Completely wipe out stock fuel and resource settings
    !RESOURCE[*] {}
    !MODULE[ModuleRealFuels],* {}
    
    // Configure B9PartSwitch with Cryogenic Cycles AND Target Pellet Storage
    MODULE
    {
        name = ModuleB9PartSwitch
        moduleID = fuelSwitch
        switcherDescription = Fusion Propellant Cycle
        baseVolume = 115000 // Volumetric capacity for 8m spherical RO dimensions
        
        SUBTYPE
        {
