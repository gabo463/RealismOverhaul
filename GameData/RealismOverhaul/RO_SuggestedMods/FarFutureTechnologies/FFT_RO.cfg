--------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------
Direct Kinetic Extraction & Physics Basis:

Chapline, G. (1988). "Fission Fragment Rocket Concept." Lawrence Livermore National Laboratory (LLNL). This paper outlines the core physics of extracting energy directly from high-velocity charged fission fragments collimated by magnetic fields rather than using thermal energy transfer to a working fluid.<

Magnetic Collimation & Thermal Constraints:
NASA Institute for Advanced Concepts (NIAC) Reports (2000s): Studies on Ultra-Lightweight Nuclear Power and Propulsion Systems, specifically analyzing superconducting magnetic nozzle designs for fragment vectoring and the thermal radiation limits on low-thrust, high-Isp space architectures.

Vacuum Specific Impulse (Isp) Limits:
Clark, P. B., & Sheldon, R. B. (2005). "A Dust-Bed Fission Fragment Rocket Engine." 41st AIAA/ASME/SAE/ASEE Joint Propulsion Conference. Details how thin rotating dust beds or fissile fiber arrays allow unshielded escape of fragments, predicting vacuum specific impulses in the range of 40,000 to 60,000 seconds.
