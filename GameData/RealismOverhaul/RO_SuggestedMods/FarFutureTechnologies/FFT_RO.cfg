// Realism Overhaul configuration for Far Future Technologies 3.75m Beam-Core Antimatter Engine

//Specific Impulse (Isp): Calibrated to $21,000,000 seconds (ve = 0.69c) based on CERN/Geant4 magnetic nozzle optimization models.

 //Keane, R. A., & Zhang, W. M. (2012). Beamed Core Antimatter Propulsion: Engine Design and Optimization. arXiv preprint arXiv:1205.2281.
 Used CERN Geant4 Monte Carlo code to model charged pion scattering in a 10 T magnetic nozzle, establishing that effective exhaust speed reaches ve≈0.69c (Isp) with proper field gradients.

//Thrust: 1,800 kN (1.8 MN) of relativistic pion thrust, making high-speed interstellar transfers and sub-light acceleration phases practical.

@PART[fft-antimatter-beam-1]:NEEDS[RealismOverhaul]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    // Rescale to match 1.6x baseline for interstellar/deep-space hulls (3.75m -> 6m)
    %rescaleFactor = 1.6
    
    @mass = 110.0 // Extremely heavy 10-15T superconducting magnetic nozzle, tungsten shadow shielding, and cryo-traps
    @maxTemp = 3200
    @crashTolerance = 8
    
    %category = Engine
    
    @MODULE[ModuleEnginesFX]
    {
        @minThrust = 0
        @maxThrust = 3800 // 3.8 MN of ultra-relativistic beam-core thrust
        @heatProduction = 65000
        
        !PROPELLANT,* {}
        
        // 50/50 Mass balance: Protons (Liquid Hydrogen) and Antiprotons (Antimatter)
        PROPELLANT
        {
            name = LqdHydrogen
            ratio = 0.50
            DrawGauge = True
        }
        PROPELLANT
        {
            name = Antimatter
            ratio = 0.50
            DrawGauge = True
        }
        
        // Power draw for high-field magnetic nozzle coils and Penning trap vacuum containment
        PROPELLANT
        {
            name = ElectricCharge
            ratio = 180000 // 180 MW continuous power overhead while firing
            DrawGauge = False
        }
        
        @atmosphereCurve
        {
            key = 0 21000000 // Relativistic exhaust velocity benchmark (~0.69c, 21 million seconds Isp)
            key = 1 100
            key = 5 0.001
        }
    }
    
    // System Heat configuration for relativistic gamma ray shielding & nozzle thermal dissipation
    @MODULE[ModuleSystemHeatProduction]:NEEDS[SystemHeat]
    {
        @heatProduction = 120000 // Demands massive high-temperature radiator arrays
    }
}

// Realism Overhaul configuration for Far Future Technologies  Antimatter Factory
@PART[fft-antimatter-factory-1]:NEEDS[RealismOverhaul]:FOR[RealismOverhaul]
{
    %RSSROConfig = True
    %rescaleFactor = 1.6
    @mass = 180.0 // Heavy particle accelerator rings and containment magnetic coils
    @maxTemp = 2500
    @crashTolerance = 8
    %category = Utility
}

// Realism Overhaul configuration for Far Future Technologies 3.75m Antimatter-Catalyzed Microfission Engine
// Catalytic Efficiency: Combines FissionPellets (fissile targets) with a tiny trace ratio of Antimatter, allowing long-range missions without demanding tons of antiproton production.
// Specific Impulse (Isp): 18,500 seconds, placing it right between advanced fusion torch drives and pure beam-core antimatter.

