@PART[proceduralEnvelope|proceduralEnvelopeCap]:NEEDS[RealismOverhaul]
{
    %RSSROConfig = True
    
    // --- Physics & Thermal Adjustment ---
    %maxTemp = 873.15
    %skinMaxTemp = 873.15
    %crashTolerance = 8
    
    %breakingForce = 50
    %breakingTorque = 50

}

@PART[proceduralEnvelope]:NEEDS[RealismOverhaul]
{
    @title = Procedural Airship Envelope (Main)
    @manufacturer = Generic
    @description = A fully customizable procedural airship envelope for lighter-than-aircraft craft. Adjust length, diameter, and shape to fit required buoyancy parameters.
    
    @mass = 0.05
    
    @MODULE[ProceduralPart]
    {
        @costPerkL = 20
        
        !UPGRADES {} 
        
        %diameterMin = 0.1
        %diameterMax = 100.0
        %lengthMin = 0.5
        %lengthMax = 200.0
        %volumeMin = 0.01
        %volumeMax = 1000000.0
    }
}

@PART[proceduralEnvelopeCap]:NEEDS[RealismOverhaul]
{
    @title = Procedural Airship Envelope (End Cap)
    @manufacturer = Generic
    @description = A customizable, streamlined nose or tail cap for procedural airship envelopes.
    
    @mass = 0.01
    
    @MODULE[ProceduralPart]
    {
        @costPerkL = 20
        
        !TECHLIMIT {}
        
        %diameterMin = 0.1
        %diameterMax = 100.0
        %lengthMin = 0.1
        %lengthMax = 100.0
        %volumeMin = 0.001
        %volumeMax = 500000.0
    }
}